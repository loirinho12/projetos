<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXOS Pessoas</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fa;--card:#fff;--ink:#241a38;--mut:#6f6783;--line:#e4def0;--pri:#6a3fb5;--priT:#ece4fa;--ok:#1f8a5b;--okT:#dcf3e8;--warn:#a85f00;--warnT:#fdecd0;--bad:#c2392b;--badT:#fbe1dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121f;--card:#211a2e;--ink:#efe9fa;--mut:#a99fbf;--line:#38304a;--pri:#b794f4;--priT:#33264d;--ok:#5cd09b;--okT:#17382b;--warn:#f0b458;--warnT:#3d2e12;--bad:#ff8f80;--badT:#43201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121f;--card:#211a2e;--ink:#efe9fa;--mut:#a99fbf;--line:#38304a;--pri:#b794f4;--priT:#33264d;--ok:#5cd09b;--okT:#17382b;--warn:#f0b458;--warnT:#3d2e12;--bad:#ff8f80;--badT:#43201c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-size:19px;font-weight:700;padding:0 8px 14px;letter-spacing:-.2px}.brand span{color:var(--pri)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-radius:9px;padding:10px 12px;font:inherit;color:var(--mut);cursor:pointer;text-align:left}
nav button:hover{background:var(--bg)}nav button.on{background:var(--priT);color:var(--pri);font-weight:600}
nav b{font-size:12px;background:var(--pri);color:#fff;border-radius:99px;padding:0 7px}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 4px 0}
main{padding:26px 28px;max-width:1100px;width:100%}
h2{font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-.3px}h3{font-size:16px;margin:22px 0 8px}
.sub{color:var(--mut);margin:0 0 18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k small{color:var(--mut);display:block}.k b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.k.bad{border-color:var(--bad)}.k.bad b{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.k.over .bar i{background:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.b{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 16px;background:var(--pri);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button.b{color:#1d1230}}
button.b.go{background:var(--ok)}
button.x{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px;margin-right:4px}
button.x:hover{border-color:var(--pri);color:var(--pri)}button.x.arm{border-color:var(--bad);color:var(--bad)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-right:10px;vertical-align:middle}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.chip.bad{background:var(--badT);color:var(--bad)}.chip.warn{background:var(--warnT);color:var(--warn)}.chip.ok{background:var(--okT);color:var(--ok)}.chip.n{background:var(--priT);color:var(--pri)}
.empty{padding:22px;color:var(--mut);text-align:center}
#msg{min-height:22px;margin-bottom:6px;font-weight:600}#msg.bad{color:var(--bad)}#msg.ok{color:var(--ok)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
pre{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;font:13px/1.6 inherit;margin:0}
.note{color:var(--mut);font-size:13px}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}.side-f{flex-direction:row;align-items:center;flex-wrap:wrap;margin-top:6px;padding:0}main{padding:18px 14px}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">NEXOS <span>Pessoas</span></div>
<nav id="nav"></nav>
<div class="side-f"><label>Perfil<select id="role"><option>RH</option><option>Gestor</option></select></label><button class="x" data-a="reset">Restaurar dados de exemplo</button></div>
</aside>
<main><div id="msg"></div><div id="v"></div></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const hoje=()=>new Date().toLocaleDateString('sv'),fD=d=>d?d.split('-').reverse().join('/'):'—',fT=t=>t?new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
const daysTo=d=>Math.round((new Date(d)-new Date(hoje()))/864e5);
const ch=(k,t)=>'<span class="chip '+k+'">'+esc(t)+'</span>';
const av=n=>{n=String(n||'?');const h=[...n].reduce((s,c)=>s+c.charCodeAt(0),0)%360;return '<span class="av" style="background:hsl('+h+' 45% 42%)">'+esc(n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())+'</span>'};
const KEYS=['fn','acl','sol','log'];
let D,cur='dash',role='RH',mt;
const save=()=>{try{localStorage.setItem('rh1',JSON.stringify(D))}catch(e){}};
const nm=(c,i,k='n')=>(D[c].find(x=>x.id==i)||{})[k]||'—',row=(c,i)=>D[c].find(x=>x.id==i);
const log=m=>{D.log.unshift({id:id(),t:Date.now(),m});D.log=D.log.slice(0,30)};
function flash(m,bad){const e=$('#msg');e.textContent=m;e.className=bad?'bad':'ok';clearTimeout(mt);mt=setTimeout(()=>e.textContent='',5000)}
function seed(){D={};KEYS.forEach(k=>D[k]=[]);const a=(c,o)=>D[c].push(Object.assign({id:id()},o));
a('fn',{mat:'1001',cod:'CR-1001',n:'Carlos Lima',fun:'Soldador',dep:'Operações',adm:'2022-03-14',cert:addD(300)});
a('fn',{mat:'1002',cod:'CR-1002',n:'Ana Reis',fun:'Técnica de segurança',dep:'Segurança',adm:'2021-08-02',cert:'2026-01-10'});
a('fn',{mat:'1003',cod:'CR-1003',n:'Marcos Teles',fun:'Eletricista',dep:'Manutenção',adm:'2023-05-20',cert:addD(20)});
a('fn',{mat:'1004',cod:'CR-1004',n:'Joana Prado',fun:'Analista de RH',dep:'RH',adm:'2020-01-06',cert:''});
a('sol',{fid:D.fn[0].id,tp:'Férias',ini:addD(25),dias:15,st:'Aguardando aprovação'})}
try{D=JSON.parse(localStorage.getItem('rh1'))}catch(e){}if(!D)seed();
const present=()=>{const l={};D.acl.forEach(e=>{if(!l[e.fid]||e.t>l[e.fid].t)l[e.fid]=e});return Object.values(l).filter(e=>e.tp=='Entrada')};
const certChip=v=>!v?'—':daysTo(v)<0?ch('bad','Vencida '+fD(v)):daysTo(v)<=30?ch('warn','Vence '+fD(v)):ch('ok',fD(v));
const who=(v,r)=>av(r.n)+esc(r.n);
const OPT=f=>(typeof f[3]=='function'?f[3]():f[3]||[]).map(x=>Array.isArray(x)?x:[x,x]);
const M={
fn:{t:'Colaboradores',s:'Cadastro, certificações e situação de cada pessoa.',c:'fn',btn:'Cadastrar colaborador',f:[['mat','Matrícula','text'],['n','Nome','text'],['fun','Cargo','text'],['dep','Departamento','select',['Operações','Segurança','Manutenção','Administrativo','RH']],['adm','Admissão','date'],['cert','Certificação até','date']],
 pre:r=>{r.cod='CR-'+r.mat;log('Novo colaborador cadastrado: '+r.n)},
 cols:[['n','Colaborador',who],['mat','Matrícula'],['fun','Cargo'],['dep','Departamento'],['adm','Admissão',fD],['cert','Certificação',certChip],[null,'Situação',(v,r)=>present().some(e=>e.fid==r.id)?ch('ok','Presente'):ch('n','Fora')]]},
pres:{t:'Presença',s:'Registre entradas e saídas pelo código do crachá ou pela matrícula.',c:'fn',nr:1,f:[],
 x:()=>'<div class="row"><input id="ac" placeholder="Código ou matrícula, ex.: CR-1001" style="flex:1;min-width:220px"><button class="b go" data-a="pass">Registrar passagem</button></div><div class="tw"><table><tbody>'+(D.acl.slice(-6).reverse().map(e=>'<tr><td>'+fT(e.t)+'</td><td>'+av(nm('fn',e.fid))+esc(nm('fn',e.fid))+'</td><td>'+ch(e.tp=='Entrada'?'ok':'warn',e.tp)+'</td></tr>').join('')||'<tr><td class="empty">Nenhuma passagem registrada.</td></tr>')+'</tbody></table></div><h3>'+present().length+' presentes agora</h3>',
 cols:[['n','Colaborador',who],['cod','Código'],[null,'Situação',(v,r)=>present().some(e=>e.fid==r.id)?ch('ok','Presente'):ch('n','Fora')]]},
sol:{t:'Solicitações',s:'Férias, folgas e atestados. Só o perfil RH aprova ou rejeita.',c:'sol',btn:'Enviar solicitação',f:[['fid','Colaborador','select',()=>D.fn.map(f=>[f.id,f.n])],['tp','Tipo','select',['Férias','Folga','Atestado']],['ini','Início','date'],['dias','Dias','number']],
 pre:r=>{r.st='Aguardando aprovação';log('Solicitação de '+r.tp+' registrada para '+nm('fn',r.fid))},
 cols:[['fid','Colaborador',v=>av(nm('fn',v))+esc(nm('fn',v))],['tp','Tipo'],['ini','Início',fD],['dias','Dias'],['st','Situação',v=>ch(/Aguard/.test(v)?'warn':v=='Rejeitada'?'bad':'ok',v)]],
 a:[['Aprovar','apr',r=>/Aguard/.test(r.st)],['Rejeitar','rej',r=>/Aguard/.test(r.st)]]},
};
const TABS=[['dash','Painel'],['fn','Colaboradores'],['pres','Presença'],['sol','Solicitações']];
function mod(k){const m=M[k],rows=D[m.c];let h='<h2>'+m.t+'</h2><p class="sub">'+m.s+'</p>'+(m.x?m.x():'');
 if(m.f.length)h+='<div class="row">'+m.f.map(f=>'<label>'+esc(f[1])+(f[2]=='select'?'<select data-k="'+f[0]+'">'+OPT(f).map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select>':'<input data-k="'+f[0]+'" type="'+f[2]+'"'+(f[2]=='number'?' step="any"':'')+'>')+'</label>').join('')+'<button class="b" data-a="add">'+m.btn+'</button></div>';
 h+='<div class="tw"><table><thead><tr>'+m.cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th></th></tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+m.cols.map(c=>'<td>'+(c[2]?c[2](r[c[0]],r):esc(r[c[0]]))+'</td>').join('')+'<td>'+(m.a||[]).filter(a=>!a[2]||a[2](r)).map(a=>'<button class="x" data-a="'+a[1]+'" data-id="'+r.id+'">'+a[0]+'</button>').join('')+(m.nr?'':'<button class="x" data-rm="'+r.id+'">Remover</button>')+'</td></tr>').join(''):'<tr><td colspan="'+(m.cols.length+1)+'" class="empty">Nada cadastrado ainda. Use o formulário acima para começar.</td></tr>')+'</tbody></table></div>';return h}
function dash(){const pend=D.sol.filter(s=>/Aguard/.test(s.st)),ve=D.fn.filter(f=>f.cert&&daysTo(f.cert)<0),a30=D.fn.filter(f=>f.cert&&daysTo(f.cert)>=0&&daysTo(f.cert)<=30);
 const K=[['Colaboradores',D.fn.length],['Presentes na base',present().length],['Certificações vencidas',ve.length,ve.length?'bad':''],['Solicitações pendentes',pend.length]];
 const al=[...pend.map(s=>s.tp+' pendente: '+nm('fn',s.fid)+' ('+s.dias+' dias)'),...ve.map(f=>'Certificação vencida: '+f.n+''),...a30.map(f=>'Certificação vence em '+daysTo(f.cert)+' dias: '+f.n)];
 const rep='Resumo de '+fD(hoje())+'\nColaboradores: '+D.fn.length+'\nPresentes na base: '+present().length+'\nCertificações vencidas: '+ve.length+' | Vencendo em 30 dias: '+a30.length+'\nSolicitações pendentes: '+pend.length;
 return '<h2>Painel de pessoas</h2><p class="sub">'+fD(hoje())+'</p><div class="g">'+K.map(k=>'<div class="k '+(k[2]||'')+'"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>').join('')+'</div><div class="two"><div><h3>Precisa de atenção</h3>'+(al.length?'<div class="tw"><table><tbody>'+al.map(a=>'<tr><td style="white-space:normal">'+ch('warn','!')+' '+esc(a)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="note">Nenhum alerta.</p>')+'<h3>Resumo do dia</h3><pre>'+esc(rep)+'</pre><div class="row" style="margin-top:10px"><button class="b" data-a="mail">Enviar resumo por e-mail</button></div></div><div><h3>Atividade recente</h3><div class="tw"><table><tbody>'+(D.log.map(l=>'<tr><td>'+fT(l.t)+'</td><td style="white-space:normal">'+esc(l.m)+'</td></tr>').join('')||'<tr><td class="empty">Nenhuma atividade ainda.</td></tr>')+'</tbody></table></div></div></div>'}
function render(){const np=D.sol.filter(s=>/Aguard/.test(s.st)).length;$('#nav').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'"'+(t[0]==cur?' class="on"':'')+'>'+t[1]+(t[0]=='sol'&&np?'<b>'+np+'</b>':'')+'</button>').join('');$('#v').innerHTML=cur=='dash'?dash():mod(cur)}
const A={
add(){const m=M[cur],o={id:id()};document.querySelectorAll('#v [data-k]').forEach(e=>{o[e.dataset.k]=e.type=='number'?(e.value===''?'':+e.value):e.value.trim()});if(o[m.f[0][0]]===''||o[m.f[0][0]]==null)return flash('Preencha o primeiro campo.',1);m.pre&&m.pre(o);D[m.c].push(o);save();flash('Cadastro salvo.');render()},
apr(i){if(role!='RH')return flash('Só o perfil RH aprova solicitações.',1);const r=row('sol',i);r.st='Aprovada';log(r.tp+' aprovada: '+nm('fn',r.fid));save();render()},
rej(i){if(role!='RH')return flash('Só o perfil RH rejeita solicitações.',1);const r=row('sol',i);r.st='Rejeitada';log(r.tp+' rejeitada: '+nm('fn',r.fid));save();render()},
pass(){const v=$('#ac').value.trim().toLowerCase(),p=v&&D.fn.find(x=>x.cod.toLowerCase()==v||String(x.mat)==v);if(!p)return flash('Código não reconhecido. Acesso negado.',1);const tp=present().some(e=>e.fid==p.id)?'Saída':'Entrada';D.acl.push({id:id(),fid:p.id,tp,t:Date.now()});save();flash(p.n+': '+tp+' registrada.');render()},
mail(){log('Resumo diário enviado por e-mail ao RH');save();flash('Resumo enviado.');render()},
reset(){seed();save();render();flash('Dados de exemplo restaurados.')}};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){cur=t.dataset.tab;return render()}
 if(t.dataset.rm){if(!t.classList.contains('arm')){t.classList.add('arm');t.textContent='Confirmar?';setTimeout(()=>{t.classList.remove('arm');t.textContent='Remover'},3000);return}D[M[cur].c]=D[M[cur].c].filter(x=>x.id!=t.dataset.rm);save();return render()}
 if(t.dataset.a&&A[t.dataset.a])A[t.dataset.a](t.dataset.id)});
document.addEventListener('change',e=>{if(e.target.id=='role'){role=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ac')A.pass()});
render();
</script>
</body>
</html>
